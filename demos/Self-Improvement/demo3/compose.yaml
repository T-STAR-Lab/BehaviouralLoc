name: self-improvement-demo3
services:
  default:
    build:
      context: "."
      dockerfile: "Dockerfile"
    command: "tail -f /dev/null"
    init: true
    stop_grace_period: 1s

    volumes:
      - ./assets/approved_drugs.csv:/workspace/approved_drugs.csv
      - ./assets/tox_scorer.py:/workspace/tox_scorer.py
